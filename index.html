  let body,badges;
  if(isR){body='Gender performance is <strong>essentially equal</strong> in Reading. The gap is only <strong>'+gap+' percentile points</strong> \u2014 neither group has a meaningful advantage across years, windows, or grade levels. Females show a slight edge in upper grades (7th-8th).';badges='<span class="badge badge-parity">Gap: '+gap+' PR pts</span><span class="badge badge-parity">No significant gender disparity</span><span class="badge badge-neutral">F slight edge in Gr 7-8</span>'}
  else{body='Males consistently outperform females in Math by <strong>'+gap+' percentile points</strong> on average. This gap persists across <strong>every window, grade level, and school year</strong>. The gap is widest in the earliest grades (11 pts in Grade 2) and at the middle school level (9 pts in Grade 7). <strong>Males are nearly twice as likely to reach Level 4</strong> (17% vs 8.8%).';badges='<span class="badge badge-gap">Gap: '+gap+' PR pts</span><span class="badge badge-alert">M 2x at Level 4 (17% vs 9%)</span><span class="badge badge-gap">Consistent across all windows</span><span class="badge badge-alert">Widest gap at Gr 2 &amp; Gr 7</span>'}
  document.getElementById("insight-banner").innerHTML='<div class="insight-banner '+cls+'"><div class="insight-title '+cls+'">'+(isR?"STAR READING":"STAR MATH")+' \u2014 KEY FINDING</div><div class="insight-body">'+body+'</div><div>'+badges+'</div></div>';
}

function renderStats(){
  const d=DATA[currentTab],fO=d.overall.find(r=>r.Sex==="F"),mO=d.overall.find(r=>r.Sex==="M");
  function card(label,fv,mv,hl){const diff=parseFloat(mv)-parseFloat(fv),abs=Math.abs(diff).toFixed(1),cls=hl?(diff>.5?"highlight-m":diff<-.5?"highlight-f":"highlight-none"):"",diffH=Math.abs(diff)>.5?'<div class="stat-diff '+(diff>0?"m-lead":"f-lead")+'">'+(diff>0?"Male":"Female")+" +"+abs+"</div>":"";return'<div class="stat-card '+cls+'"><div class="stat-label">'+label+'</div><div class="stat-vals"><div><span class="stat-f">'+fv+'</span><span class="stat-suffix">F</span></div><div><span class="stat-m">'+mv+'</span><span class="stat-suffix">M</span></div></div>'+diffH+"</div>"}
  document.getElementById("stat-row").innerHTML=card("Mean Scaled Score",fO.mean_ss,mO.mean_ss,true)+card("Median Scaled Score",fO.median_ss,mO.median_ss,false)+card("Mean Percentile",fO.mean_pr,mO.mean_pr,true)+card("Total Assessments",fO.count.toLocaleString(),mO.count.toLocaleString(),false);
}

function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={}}
function mc(id){return'<div class="chart-wrap"><canvas id="'+id+'"></canvas></div>'}

function renderCharts(){
  destroyCharts();const d=DATA[currentTab],m=currentMetric,mL=m==="mean_pr"?"Mean Percentile Rank":"Mean Scaled Score";
  const grid=document.getElementById("chart-grid");
  grid.innerHTML='<div class="chart-card"><div class="chart-title">'+mL+' by Grade Level</div><div class="chart-note">Grades 2-8</div>'+mc("ch-grade")+'</div>'+'<div class="chart-card"><div class="chart-title">'+mL+' by Testing Window</div><div class="chart-note">Windows 1-4 across all years</div>'+mc("ch-window")+'</div>'+'<div class="chart-card"><div class="chart-title">'+mL+' Trend \u2014 Year \u00d7 Window</div><div class="chart-note">Chronological progression across all testing periods</div>'+mc("ch-trend")+'</div>'+'<div class="chart-card"><div class="chart-title">'+mL+' by School</div>'+mc("ch-school")+'</div>'+'<div class="chart-card"><div class="chart-title">'+mL+' by School Year</div>'+mc("ch-year")+'</div>'+'<div class="chart-card"><div class="chart-title">State Benchmark Distribution (%)</div><div class="chart-note">% of each gender at each performance level</div>'+mc("ch-state")+'</div>'+'<div class="chart-card chart-card-full"><div class="chart-title">District Benchmark Distribution (%)</div><div class="chart-note">% of each gender by district performance category</div>'+mc("ch-dist")+'</div>';

  const gr=pivot(d.byGrade,"Grade at Testing",m);
  charts.grade=new Chart(document.getElementById("ch-grade"),{type:"bar",data:{labels:gr.labels.map(v=>"Gr "+v),datasets:ds(gr.fVals,gr.mVals)},options:opts(false)});

  const wi=pivot(d.byWindow,"Window",m);
  charts.window=new Chart(document.getElementById("ch-window"),{type:"bar",data:{labels:wi.labels.map(v=>v.replace("Window ","W")),datasets:ds(wi.fVals,wi.mVals)},options:opts(false)});

  const tr=pivotYW(d.byYearWindow,m);
  charts.trend=new Chart(document.getElementById("ch-trend"),{type:"line",data:{labels:tr.labels,datasets:ds(tr.fVals,tr.mVals,"line")},options:opts(false)});

  const sc=pivot(d.bySchool,"School Name",m);
  charts.school=new Chart(document.getElementById("ch-school"),{type:"bar",data:{labels:sc.labels.map(n=>SCHOOL_SHORT[n]||n),datasets:ds(sc.fVals,sc.mVals)},options:opts(false,"y")});

  const yr=pivot(d.byYear,"School Year",m);
  charts.year=new Chart(document.getElementById("ch-year"),{type:"bar",data:{labels:yr.labels,datasets:ds(yr.fVals,yr.mVals)},options:opts(false)});

  const sb=pivotBench(d.stateBenchmark);
  charts.state=new Chart(document.getElementById("ch-state"),{type:"bar",data:{labels:sb.labels,datasets:ds(sb.fVals,sb.mVals)},options:opts(true)});

  const db=pivotBench(d.districtBenchmark);
  charts.dist=new Chart(document.getElementById("ch-dist"),{type:"bar",data:{labels:db.labels,datasets:ds(db.fVals,db.mVals)},options:opts(true)});
}

function switchTab(tab){
  currentTab=tab;
  document.getElementById("tab-reading").className=tab==="reading"?"tab-btn reading-active":"tab-btn inactive";
  document.getElementById("tab-math").className=tab==="math"?"tab-btn math-active":"tab-btn inactive";
  updateMB();renderAll();
}
function switchMetric(m){currentMetric=m;updateMB();renderAll()}
function updateMB(){
  const cls=currentTab==="reading"?"active-reading":"active-math";
  document.getElementById("mbtn-mean_pr").className=currentMetric==="mean_pr"?"metric-btn "+cls:"metric-btn inactive";
  document.getElementById("mbtn-mean_ss").className=currentMetric==="mean_ss"?"metric-btn "+cls:"metric-btn inactive";
}
function renderAll(){renderInsight();renderStats();renderCharts()}

Chart.defaults.font.family="'DM Sans','Segoe UI',system-ui,sans-serif";
Chart.defaults.color="#8899aa";
renderAll();
</script>
</body>
</html>
